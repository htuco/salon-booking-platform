name: core_domain
description: Entiteti i pravila domena — vertikale, terminologija, booking pravila.
version: 0.0.1
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.13.0

# Namjerno bez `flutter` zavisnosti. `.claude/docs/architecture.md` traži ovaj sloj
# "bez Fluttera i bez mreže" — cim paket zavisi od Fluttera, prestaje biti upotrebljiv
# iz cistog Dart konteksta (skripta, server, test bez binding-a) i smjer zavisnosti
# se tiho obrne. Testovi zato idu na `package:test`, ne `flutter_test`.
dev_dependencies:
  test: ^1.25.0
