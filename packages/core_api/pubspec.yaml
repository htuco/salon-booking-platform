name: core_api
description: Repozitoriji nad Supabaseom — jedini sloj koji zna za mrežu i tabele.
version: 0.0.1
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=1.17.0'

# Modeli ne stoje ovdje nego u `core_domain` — v. `docs/adr/0006-modeli-u-core-domain.md`.
# Ovaj paket drzi repozitorije, mapiranje gresaka i Riverpod providere; codegen mu zato
# ne treba.
dependencies:
  core_domain:
    path: ../core_domain
  crypto: ^3.0.7
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # `MockClient` iz `package:http/testing.dart` — hvata stvarni URL koji PostgREST builder
  # posalje, bez mreze. Koristi ga test smjera sortiranja u `appointment_repository_test`.
  http: ^1.2.2
  mocktail: ^1.0.4

flutter:
