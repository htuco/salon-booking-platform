<script>

document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const content=document.querySelector('#content'),layer=document.querySelector('#layer'),sheetContent=document.querySelector('#sheet-content');
let requestEmployee='Svi',requestSort='waiting';
let page='today',employee='Svi',selectedDay=18,lastFocus,toastTimer;
let requests=[{id:1,name:'Nedim Hodžić',initial:'NH',service:'Fade + brada',worker:'Amar',price:30,date:'2026-05-18',dayLabel:'Danas, 18. maj',time:'15:00',wait:26},{id:2,name:'Almir Šahić',initial:'AŠ',service:'Muško šišanje',worker:'Amar',price:15,date:'2026-05-18',dayLabel:'Danas, 18. maj',time:'17:00',wait:12},{id:3,name:'Adnan Kovač',initial:'AK',service:'Šišanje + brada',worker:'Emir',price:30,date:'2026-05-19',dayLabel:'Sutra, 19. maj',time:'10:00',wait:8},{id:4,name:'Tarik Jurić',initial:'TJ',service:'Muško šišanje',worker:'Vedran',price:15,date:'2026-05-19',dayLabel:'Sutra, 19. maj',time:'11:30',wait:4}];
const appointments=[{time:'13:30',name:'Haris Delić',service:'Muško šišanje',worker:'Emir',price:15},{time:'14:00',name:'Marko Marić',service:'Fade + brada',worker:'Amar',price:30},{time:'14:30',name:'Ivan Petrović',service:'Muško šišanje',worker:'Vedran',price:15},{time:'15:30',name:'Dino Kovačević',service:'Šišanje + brada',worker:'Emir',price:30}];
function requestCard(r,i){return `<article class="request"><div class="request-row"><div class="initial ${i%2?'pink':''}">${r.initial}</div><div class="person"><strong>${r.name}</strong><div class="meta">${r.service}<span class="request-separator"> · </span><br>${r.worker} · ${r.price} KM</div></div><div class="time"><div class="request-date">${r.dayLabel.split(',')[0]}</div><strong>${r.time}</strong><div class="waiting">čeka ${r.wait} min</div></div></div><div class="actions"><button class="secondary" data-reject="${r.id}">Odbij</button><button class="primary" data-confirm="${r.id}">Prihvati</button></div></article>`}
function chips(){return `<div class="chips" aria-label="Filter zaposlenika">${['Svi','Emir','Vedran','Amar'].map(n=>`<button class="chip ${employee===n?'active':''}" aria-pressed="${employee===n}" data-employee="${n}">${n}</button>`).join('')}</div>`}
function agenda(){return appointments.filter(a=>employee==='Svi'||a.worker===employee).map(a=>`<div class="agenda-row"><span class="agenda-hour">${a.time}</span><div class="agenda-card"><div><strong>${a.name}</strong><div class="meta">${a.service} · ${a.worker}</div></div><span class="tag">${a.price} KM</span></div></div>`).join('')}
function today(){return `<h2 class="sr-only">Danas</h2><div class="context-row"><span>Pon, 18. maj</span><span class="status-inline"><span class="dot"></span>Otvoreno do 20:00</span></div><div class="page today-page"><section class="next" aria-label="Sljedeći termin"><div class="next-label"><span class="dot"></span>SLJEDEĆI · 13:30<span class="eta">za 18 min</span></div><div class="next-row"><div><strong>Haris Delić</strong><div class="meta">Muško šišanje · Emir</div></div><span class="next-duration">30 min</span></div></section><section class="requests-block"><div class="section-title"><h3>Zahtjevi <span class="count">${requests.length}</span></h3><button class="link" data-page="requests">Vidi sve ↗</button></div>${requests.length?requests.slice(0,2).map(requestCard).join(''):'<div class="empty">Sve je riješeno. Nema novih zahtjeva.</div>'}</section><section class="schedule-block"><div class="section-title"><h3>Raspored danas</h3><button class="link" data-page="calendar">Kalendar ↗</button></div>${chips()}<div class="now">13:12 <i></i> SADA</div>${agenda()}</section><section class="daily-summary" aria-label="Pregled dana"><div class="date">Pregled dana</div><div class="metrics"><div class="metric"><strong>60 <small>KM</small></strong><span>naplaćeno</span></div><div class="metric"><strong>283 <small>KM</small></strong><span>prognoza</span></div><div class="metric"><strong>16</strong><span>termina danas</span></div></div></section><div class="nav-space"></div></div>`}
function week(){return `<div class="week">${['PON','UTO','SRI','ČET','PET','SUB','NED'].map((d,i)=>`<button class="day ${selectedDay===18+i?'selected':''}" data-day="${18+i}" aria-pressed="${selectedDay===18+i}"><span>${d}</span><b>${18+i}</b></button>`).join('')}</div>`}
function calendar(){const list=appointments.filter(a=>employee==='Svi'||a.worker===employee);return '<h2 class="sr-only">Kalendar</h2><div class="calendar-picker"><div class="context-row"><span>Maj 2026</span><span class="week-caption">18–24. maj · Sedmica 21</span></div>'+week()+'</div>'+`<div class="page">${chips()}<div class="calendar-heading"><h3>${selectedDay===18?'Danas':selectedDay+'. maj'} <span>· ${employee==='Svi'?'Cijeli tim':employee}</span></h3><span>${selectedDay===18?list.length:0} u prikazu</span></div>${selectedDay!==18?'<div class="empty">Nema termina za ovaj dan.<br>Dodaj prvi dodirom loga lokala.</div>':['13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30'].map((time,i)=>{const a=list.find(a=>a.time===time);return `<div class="slot"><span>${time}</span><div class="slot-body">${a?`<div class="booking ${i%3===0?'blue':i%3===2?'peach':''}"><strong>${a.name}</strong><div class="meta">${a.service} · ${a.worker} · ${a.price} KM</div></div>`:time==='15:00'?'<div class="break">Pauza · 30 min</div>':`<button class="free" data-slot="${time}">+ Slobodan termin</button>`}</div></div>`}).join('')}<div class="nav-space"></div></div>`}
function requestsPage(){
 const visible=requests.filter(r=>requestEmployee==='Svi'||r.worker===requestEmployee).sort((a,b)=>requestSort==='waiting'?b.wait-a.wait:(a.date+' '+a.time).localeCompare(b.date+' '+b.time));
 return `<h2 class="sr-only">Zahtjevi</h2><div class="context-row"><span>Za prihvatanje <span class="pending-number">${requests.length}</span></span><span class="week-caption">Online rezervacije</span></div><div class="queue-page decision-page"><div class="queue-tools"><label><span class="sr-only">Zaposlenik</span><select id="request-employee">${['Svi','Emir','Vedran','Amar'].map(n=>`<option value="${n}" ${requestEmployee===n?'selected':''}>${n==='Svi'?'Cijeli tim':n}</option>`).join('')}</select></label><label><span class="sr-only">Redoslijed</span><select id="request-sort"><option value="waiting" ${requestSort==='waiting'?'selected':''}>Najduže čekaju</option><option value="time" ${requestSort==='time'?'selected':''}>Najbliži termin</option></select></label></div><div class="decision-intro">${visible.length?'Klijenti čekaju tvoj odgovor.':''}</div><div class="request-list">${visible.map(r=>`<article class="decision-card" aria-labelledby="request-name-${r.id}"><div class="decision-client"><h3 id="request-name-${r.id}">${r.name}</h3><span class="decision-wait"><span class="dot"></span>čeka ${r.wait} min</span></div><div class="decision-service"><span>${r.service}</span><strong>${r.price} <small>KM</small></strong></div><div class="decision-booking"><span>${icon('calendar')}<strong>${r.dayLabel}</strong><b>${r.time}</b></span><span>${icon('person')}${r.worker}</span></div><div class="actions"><button class="secondary" data-reject="${r.id}" aria-label="Odbij zahtjev: ${r.name}">Odbij</button><button class="primary" data-confirm="${r.id}" aria-label="Prihvati zahtjev: ${r.name}">${icon('check')}Prihvati</button></div></article>`).join('')}</div>${!visible.length?'<div class="queue-empty">'+icon('check')+'<h3>Sve riješeno</h3><p>'+(!requests.length?'Nema rezervacija na čekanju.':'Nema zahtjeva za odabranog zaposlenika.')+'</p></div>':''}<div class="nav-space"></div></div>`;
}
function requestDetail(id){const r=requests.find(r=>r.id===id);if(!r)return;showSheet(r.name,`<div class="request-detail-status"><span class="dot"></span>Na čekanju · ${r.wait} min</div><dl class="request-details"><div><dt>Termin</dt><dd>${r.dayLabel} · ${r.time}</dd></div><div><dt>Usluga</dt><dd>${r.service}</dd></div><div><dt>Zaposlenik</dt><dd>${r.worker}</dd></div><div><dt>Cijena</dt><dd>${r.price} KM</dd></div></dl><div class="actions detail-actions"><button class="secondary" data-reject="${r.id}">Odbij</button><button class="primary" data-confirm="${r.id}">Prihvati</button></div>`)}
function more(){
 const groups=[['Poslovanje',[['person','Klijenti'],['team','Osoblje'],['scissors','Usluge']]],['Salon',[['clock','Radno vrijeme'],['settings','Postavke salona']]]];
 return `<h2 class="sr-only">Još</h2><div class="plain-menu">${groups.map(([title,items],i)=>`<section aria-labelledby="menu-${i}"><h3 id="menu-${i}">${title}</h3>${items.map(([ic,n])=>`<button class="plain-menu-row" data-preview="${n}">${icon(ic)}<span>${n}</span>${icon('arrow')}</button>`).join('')}</section>`).join('')}<section aria-labelledby="menu-account"><h3 id="menu-account">Nalog</h3><button class="plain-menu-row profile-row" id="profile">${icon('person')}<span>Moj profil<small>Emir Baručija · vlasnik</small></span>${icon('arrow')}</button></section><div class="nav-space"></div></div>`;
}
function render(){content.innerHTML=page==='today'?today():page==='calendar'?calendar():page==='requests'?requestsPage():more();document.querySelectorAll('.nav [data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const badge=document.querySelector('#badge');badge.textContent=requests.length;badge.hidden=!requests.length}
function navigate(p){page=p;render();content.scrollTop=0}
function showSheet(title,body,description=''){if(layer.hidden)lastFocus=document.activeElement;sheetContent.innerHTML=`<div class="sheet-heading"><h2 id="sheet-title">${title}</h2><button class="close" aria-label="Zatvori" id="close">${icon('close')}</button></div>${description?`<p class="sheet-intro">${description}</p>`:''}${body}`;layer.hidden=false;document.querySelector('#close').focus();document.querySelector('#content').inert=true;document.querySelector('.nav').inert=true;document.querySelector('.top').inert=true}
function closeSheet(){layer.hidden=true;document.querySelector('#content').inert=false;document.querySelector('.nav').inert=false;document.querySelector('.top').inert=false;if(lastFocus?.isConnected)lastFocus.focus();else document.querySelector('#add').focus()}
function quickActions(){showSheet('Šta dodajemo?',[[ 'calendar','Napravi termin','Rezerviši vrijeme za klijenta'],['clock','Blokiraj vrijeme','Pauza, odsustvo ili privatna obaveza'],['person','Dodaj klijenta','Sačuvaj kontakt novog klijenta'],['team','Dodaj radnika','Proširi tim svog lokala'],['scissors','Dodaj uslugu','Dopuni ponudu salona']].map(([i,n,d],index)=>`<button class="quick ${index===0?'featured':''}" data-action="${n}"><span class="q-icon">${icon(i)}</span><span><strong>${n}</strong><small>${d}</small></span><span class="chevron">${icon('arrow')}</span></button>`).join(''),'Barber Studio Vitez · Brze akcije')}
function actionForm(action,time='14:00'){let fields='';if(action==='Napravi termin'){fields=`<label class="field">Ime klijenta<input required placeholder="Ime i prezime" autocomplete="name"></label><label class="field">Usluga<select><option>Muško šišanje · 15 KM</option><option>Fade + brada · 30 KM</option></select></label><label class="field">Zaposlenik<select>${['Emir','Vedran','Amar'].map(n=>`<option ${employee===n?'selected':''}>${n}</option>`).join('')}</select></label>`}else if(action!=='Blokiraj vrijeme'){fields=`<label class="field">${action==='Dodaj uslugu'?'Naziv usluge':'Ime i prezime'}<input required placeholder="Unesi podatke"></label>`}if(action==='Napravi termin'||action==='Blokiraj vrijeme'){fields+=`<label class="field">Datum<input type="date" value="2026-05-${page==='calendar'?selectedDay:18}" required></label><label class="field">Vrijeme<input type="time" value="${time}" required></label>`}showSheet(action,`<form id="demo-form">${fields}<button class="primary submit" type="submit">Isprobaj spremanje</button></form>`,'Demo forme · Podaci se ne šalju niti trajno čuvaju.')}
function toast(message){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,3500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);else if(b.dataset.employee){employee=b.dataset.employee;const y=content.scrollTop;render();content.scrollTop=y}else if(b.dataset.day){selectedDay=Number(b.dataset.day);render()}else if(b.dataset.request){requestDetail(Number(b.dataset.request))}else if(b.dataset.confirm){if(!layer.hidden)closeSheet();requests=requests.filter(r=>r.id!==Number(b.dataset.confirm));render();document.querySelector('#add').focus();toast('Zahtjev prihvaćen u demo prikazu.')}else if(b.dataset.reject){const id=Number(b.dataset.reject);showSheet('Odbiti zahtjev?',`<p class="sheet-intro">${requests.find(r=>r.id===id).name} · Ova radnja mijenja samo demo prikaz.</p><div class="actions"><button class="secondary" id="cancel">Odustani</button><button class="primary" data-remove="${id}">Odbij zahtjev</button></div>`)}else if(b.dataset.remove){requests=requests.filter(r=>r.id!==Number(b.dataset.remove));closeSheet();render();document.querySelector('#add').focus();toast('Zahtjev odbijen u ovom prikazu.')}else if(b.id==='add')quickActions();else if(b.id==='close'||b.id==='cancel')closeSheet();else if(b.dataset.action)actionForm(b.dataset.action);else if(b.dataset.slot)actionForm('Napravi termin',b.dataset.slot);else if(b.dataset.preview)showSheet(b.dataset.preview,'<p class="sheet-intro">Ovaj ekran nije dio ovog mocka. Ovdje provjeravamo Danas, Kalendar i brze akcije.</p>');else if(b.id==='account'||b.id==='profile')showSheet('Moj nalog','<p class="sheet-intro">Emir Baručija<br>Vlasnik lokala · Barber Studio Vitez</p>')});
document.addEventListener('change',e=>{if(e.target.id==='request-sort'){requestSort=e.target.value;render();document.querySelector('#request-sort').focus()}else if(e.target.id==='request-employee'){requestEmployee=e.target.value;render();document.querySelector('#request-employee').focus()}});
document.addEventListener('submit',e=>{if(e.target.id==='demo-form'){e.preventDefault();closeSheet();toast('Demo pregled završen. Podaci nisu sačuvani.')}});
layer.addEventListener('click',e=>{if(e.target===layer)closeSheet()});
document.addEventListener('keydown',e=>{if(layer.hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const focusable=[...layer.querySelectorAll('button,input,select')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
</body>
</html>
