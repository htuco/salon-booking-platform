<div style="position:relative;width:402px;background:#0f1012;border:1px solid rgba(29,31,32,.25)"><div style="height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 15px 'Archivo';color:#fff;position:absolute;top:0;left:0;right:0;z-index:5"><span>9:41</span><span>▮▮▮ ⌃ ▰</span></div>
<div style="display:flex;flex-direction:column;background:#0f1012"><div style="padding:64px 22px 0"><div style="display:flex;align-items:center;gap:10px;min-height:48px;font:600 18px 'Archivo';color:#fff"><span style="font-size:22px;line-height:1">←</span>O aplikaciji</div><h1 style="margin:10px 0 6px;font:400 40px/1.05 'DM Serif Display';color:#fff">Pravila korištenja</h1><div style="font:400 16px 'Archivo';color:#9aa1a7">Zadnja izmjena: 1. maj 2026.</div></div>
<div style=";padding:16px 22px 0">
<div style="border-top:1px solid #33383c;padding:20px 0 4px"><div style="font:600 14px 'Archivo';letter-spacing:.16em;text-transform:uppercase;color:#9aa1a7;margin-bottom:6px">01</div><div style="font:400 26px 'DM Serif Display';color:#fff;margin-bottom:10px">Zakazivanje</div><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Zahtjev za termin nije potvrda. Termin je potvrđen tek kad salon prihvati zahtjev i kad dobijete obavještenje u aplikaciji.</p></div>
<div style="border-top:1px solid #33383c;padding:20px 0 4px"><div style="font:600 14px 'Archivo';letter-spacing:.16em;text-transform:uppercase;color:#9aa1a7;margin-bottom:6px">02</div><div style="font:400 26px 'DM Serif Display';color:#fff;margin-bottom:10px">Otkazivanje</div><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Termin možete otkazati najkasnije 2 sata prije početka. Kasnije otkazivanje ili nedolazak salon može evidentirati.</p><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Tri nedolaska u šest mjeseci mogu ograničiti online zakazivanje — u tom slučaju termin zakazujete telefonom.</p></div>
<div style="border-top:1px solid #33383c;padding:20px 0 4px"><div style="font:600 14px 'Archivo';letter-spacing:.16em;text-transform:uppercase;color:#9aa1a7;margin-bottom:6px">03</div><div style="font:400 26px 'DM Serif Display';color:#fff;margin-bottom:10px">Kašnjenje</div><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Ako kasnite više od 10 minuta, salon može skratiti uslugu ili ponuditi prvi sljedeći slobodan termin.</p></div>
<div style="border-top:1px solid #33383c;padding:20px 0 4px"><div style="font:600 14px 'Archivo';letter-spacing:.16em;text-transform:uppercase;color:#9aa1a7;margin-bottom:6px">04</div><div style="font:400 26px 'DM Serif Display';color:#fff;margin-bottom:10px">Cijene</div><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Cijene u aplikaciji su informativne i važe za standardnu izvedbu usluge. Konačna cijena se dogovara u salonu.</p></div>
<div style="border-top:1px solid #33383c;padding:20px 0 4px"><div style="font:600 14px 'Archivo';letter-spacing:.16em;text-transform:uppercase;color:#9aa1a7;margin-bottom:6px">05</div><div style="font:400 26px 'DM Serif Display';color:#fff;margin-bottom:10px">Vaši podaci</div><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Čuvamo ime, broj telefona i historiju termina — samo zbog zakazivanja i podsjetnika. Podatke ne prodajemo i ne dijelimo trećim stranama.</p><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Brisanje računa i svih podataka možete zatražiti u Postavkama.</p></div>
<div style="border-top:1px solid #33383c;padding:20px 0 4px"><div style="font:600 14px 'Archivo';letter-spacing:.16em;text-transform:uppercase;color:#9aa1a7;margin-bottom:6px">06</div><div style="font:400 26px 'DM Serif Display';color:#fff;margin-bottom:10px">Kontakt</div><p style="margin:0 0 14px;font:400 16px/1.6 'Archivo';color:#c3c9ce">Za sve nejasnoće: 030 711 220 ili info@barberstudiovitez.ba.</p></div>
