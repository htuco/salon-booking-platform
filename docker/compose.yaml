# Testno okruzenje u kontejneru.
#
#   docker compose -f docker/compose.yaml run --rm tests
#
# Pokriva Dart/Flutter stranu: codegen od nule, gen_flavors --check, format,
# analizu i testove. Niko ne mora imati Flutter na hostu.
#
# Supabase strana NIJE ovdje namjerno: `supabase` CLI vec orkestrira svoj stack
# od desetak kontejnera (Postgres, GoTrue, PostgREST, …). Rucno prepisan compose
# bi to duplirao i, gore, razisao se sa onim sto produkcija stvarno pokrece.
# Za nju: ./tool/test_supabase.sh
#
# Oba zajedno: ./tool/test_all.sh

services:
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    image: salon-booking-tests:local
    # Bez mounta izvornog koda — kod ulazi kroz COPY u Dockerfileu, sto je i
    # poenta: kontejner vidi samo ono sto nije u .dockerignore, pa codegen mora
    # proci od nule. Mount bi uvukao lokalne *.g.dart i ubio taj dokaz.
    volumes:
      # Kes pub paketa prezivljava rebuild — jedina stvar koja se dijeli sa hostom.
      - pub-cache:/root/.pub-cache

volumes:
  pub-cache:
