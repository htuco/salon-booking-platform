<!DOCTYPE html>
<html lang="bs">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Melura — administracija salona.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Melura">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon: `.ico` nosi 16 i 32 px za stare browsere, PNG ide modernima. -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Melura</title>
  <link rel="manifest" href="manifest.json">

  <!--
    FE-205: pozadina prije nego što Flutter nacrta prvi kadar.

    Bez ovoga je to bijela stranica, pa se pri svakom otvaranju vidi bijeli bljesak
    prije radne površine.

    Vrijednost je `AdminPalette.light.ground` iz `admin_colors.dart` (`#FCFCF9`).
    **Ovo je jedino mjesto u repou gdje admin boja smije stajati izvan tog fajla** — CSS
    ne može čitati Dart tokene. Kad se `ground` promijeni, mijenja se i ovdje;
    `apps/admin/test/web_splash_test.dart` pada ako se razmimoiđu.

    **Samo svijetla.** Admin je uvijek svijetao (`themeMode: ThemeMode.light` u
    `main.dart`, ADR-0020), pa bi tamna pozadina po `prefers-color-scheme` na OS-u u dark
    modu dala tamno pa svijetlo — upravo bljesak koji FE-205 sklanja (task 63). Tamna
    varijanta se vraća istim redom kad se vrati `ThemeMode.system`.

    `color-scheme` uz to kaže pregledniku da i sam scrollbar i pozadinu prije CSS-a
    iscrta u istoj shemi.
  -->
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; background-color: #FCFCF9; }
  </style>

  <!--
    Task 63: animacija „Termin i sada" dok se Flutter učitava — prepis
    `assets/brand/melura-ucitavanje.svg` i widgeta `AdminUcitavanje`. Boje su
    `AdminPalette.light.action` (termin) i `.nowLine` (linija), samo svijetle, kao
    pozadina iznad;
    trajanje i kriva su `AdminUcitavanje.trajanje` i `.kriva`. `web_splash_test.dart`
    pada kad se išta od toga razmimoiđe sa Dartom.

    Flutter na prvom kadru šalje događaj `flutter-first-frame`; tada splash nestaje,
    da ne stoji ispod aplikacije i ne hvata ništa.
  -->
  <style>
    #ucitavanje {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #ucitavanje svg { width: 72px; height: 72px; }
    #ucitavanje .termin { fill: #EE6C4D; }
    #ucitavanje .sada {
      fill: #3D5A80;
      animation: klizi 1.6s cubic-bezier(.45, 0, .25, 1) infinite;
    }
    @keyframes klizi {
      0%, 100% { transform: translateY(-34px); }
      50% { transform: translateY(34px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #ucitavanje .sada { animation: none; }
    }
  </style>
</head>
<body>
  <div id="ucitavanje" role="progressbar" aria-label="Učitavanje">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect class="termin" x="24" y="12" width="52" height="76" rx="10"/>
      <g class="sada">
        <rect x="8" y="46.5" width="84" height="7" rx="3.5"/>
        <circle cx="12" cy="50" r="7.5"/>
      </g>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('ucitavanje');
      if (splash) splash.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
