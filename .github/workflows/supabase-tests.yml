name: Supabase tests

# Ide i na PR i na push u main. Ovo je job zbog kojeg CI uopste postoji:
# tenant izolacija je jedino mjesto gdje greska curi tude podatke, pa tudi
# PR ne smije uci u main nedokazan. Ubuntu-only, ~3,6 naplativih minuta —
# skup je bio macOS iOS build, ne ovo.
#
# Lokalno se ista suite pokrene sa ./tool/test_supabase.sh (~2 min).
# v. .claude/docs/workflows.md.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-tests.yml'
      - 'packages/core_api/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-tests.yml'
      # Kolone koje rest_public_catalog.ts salje su kopija onih iz repozitorija —
      # promjena u core_api mora ponoviti ovaj dokaz.
      - 'packages/core_api/**'
  workflow_dispatch:

concurrency:
  group: supabase-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-isolation:
    name: Schema, RLS and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Applies every migration and seed.sql from scratch. A migration that does
      # not apply cleanly on an empty database fails here, not in production.
      - name: Start local Supabase
        run: supabase start

      # pgTAP: tenant isolation runs inside a rollback transaction.
      - name: Run pgTAP tests
        run: supabase test db

      # REST level: two real Auth users, two real JWTs, PostgREST + RLS end to end.
      - name: Run REST isolation test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          # Fail loudly instead of testing against an unconfigured stack.
          test -n "$SUPABASE_ANON_KEY" || { echo "ANON_KEY missing from supabase status"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SERVICE_ROLE_KEY missing from supabase status"; exit 1; }
          deno run --allow-env --allow-net supabase/tests/rest_isolation.ts

      # Anon level: the public catalog must answer with no user JWT at all, using the exact
      # column lists the core_api repositories send. Proves the task-08 DoD item that cannot
      # be proven on a dev machine without Docker.
      - name: Run public catalog test (no login)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          test -n "$SUPABASE_ANON_KEY" || { echo "ANON_KEY missing from supabase status"; exit 1; }
          deno run --allow-env --allow-net supabase/tests/rest_public_catalog.ts

      # Upsert klijenta i rezervacija: jedini test koji prolazi cijeli put kojim ide app —
      # prijava, identitet, ensure_customer, book_appointment — i jedini koji dokazuje da
      # konflikt stvarno izlazi kao HTTP 409 kroz PostgREST, a ne samo kao PT409 u bazi.
      - name: Run customer upsert + booking test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          test -n "$SUPABASE_ANON_KEY" || { echo "ANON_KEY missing from supabase status"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SERVICE_ROLE_KEY missing from supabase status"; exit 1; }
          deno run --allow-env --allow-net supabase/tests/rest_customer_upsert.ts

      # Cross-salon isolation: the business risk, not a technical formality. One person, two
      # salons; salon A must not learn that its customer is also salon B's. Covers the paths
      # a leak actually takes — embed, join, and a filter by auth_identity_id, which an admin
      # knows because it sits in their own row.
      - name: Run cross-salon isolation test
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-}"
          test -n "$SUPABASE_ANON_KEY" || { echo "ANON_KEY missing from supabase status"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SERVICE_ROLE_KEY missing from supabase status"; exit 1; }
          deno run --allow-env --allow-net supabase/tests/rest_cross_salon_isolation.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
