# Git hook runner — v. docs/07-tech-architecture.md §6.
# Instalacija (jednom, nakon `npm i`): npx lefthook install
#
# Ovaj package.json u rootu postoji samo zbog lefthooka. Toolchain wireframe
# prototipa je u prototype/ i ima svoj package.json.
#
# prototype/ je zamrznut, pa za njega nema ni eslint/prettier ni hooka. Kad
# stigne pravi `web/` (Next.js konzola, docs/07 §1), hook se dodaje tad.
pre-commit:
  parallel: true
  commands:
    dart-format:
      glob: "{apps,packages}/**/*.dart"
      run: dart format --set-exit-if-changed {staged_files}
      stage_fixed: true
